<!doctype html>
<!-- v24: fixes packaging/loader issue, includes the 3d GLB, and prevents stale loader errors from covering a loaded model. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Wine Case Wrap Preview</title>
  <meta name="description" content="Full-resolution GLB preview for a wine case wrap mockup with exterior-only texture swapping." />
  <style>
    :root {
      color-scheme: light;
      --bg-0: #f8f5ef;
      --bg-1: #eee7da;
      --bg-2: #dfd2bf;
      --glass: rgba(255, 252, 246, 0.72);
      --line: rgba(51, 42, 32, 0.14);
      --text: #241f18;
      --muted: rgba(36, 31, 24, 0.58);
      --accent: #9d6b27;
      --shadow: rgba(62, 42, 22, 0.16);
      --grid-line: rgba(74, 54, 32, 0.05);
      --drop-bg: rgba(255, 252, 246, 0.84);
      --drop-border: rgba(157, 107, 39, 0.54);
      --radius: 999px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --app-height: 100dvh;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    body.dark {
      color-scheme: dark;
      --bg-0: #0d0d0c;
      --bg-1: #1a1815;
      --bg-2: #2a251e;
      --glass: rgba(16, 15, 13, 0.68);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f7f1e8;
      --muted: rgba(247, 241, 232, 0.62);
      --accent: #d9b66f;
      --shadow: rgba(0, 0, 0, 0.28);
      --grid-line: rgba(255, 255, 255, 0.035);
      --drop-bg: rgba(10, 9, 7, 0.76);
      --drop-border: rgba(244, 221, 170, 0.58);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: var(--app-height);
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      color: var(--text);
      font-family: var(--font);
      background:
        radial-gradient(circle at 26% 18%, color-mix(in srgb, var(--accent) 17%, transparent), transparent 32%),
        radial-gradient(circle at 80% 22%, rgba(255, 255, 255, 0.38), transparent 26%),
        linear-gradient(145deg, var(--bg-0), var(--bg-1) 52%, var(--bg-2));
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: var(--app-height);
      overflow: hidden;
      isolation: isolate;
      touch-action: none;
    }

    /* Keep the DOM layer cheap. The 3D grid handles visual grounding, so the old
       full-screen CSS grid/mask overlay is removed for smoother interaction. */
    #stage::before { display: none; }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      outline: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas:active { cursor: grabbing; }

    .topbar {
      /* Hidden visual status layer. Status text is kept only for internal updates/accessibility,
         so the desktop UI stays clean with no top-left title or texture filename labels. */
      position: fixed;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      pointer-events: none;
    }

    .title,
    .status,
    .controls {
      pointer-events: auto;
      border: 1px solid var(--line);
      background: var(--glass);
      box-shadow: 0 12px 34px var(--shadow);
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
    }

    .title {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 13px;
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      flex: none;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent);
    }

    .title strong,
    .status strong {
      color: var(--text);
      font-weight: 700;
    }

    .status {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: min(52vw, 560px);
      padding: 8px 13px;
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .controls {
      position: fixed;
      left: 50%;
      bottom: calc(14px + var(--safe-bottom));
      z-index: 4;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 6px;
      max-width: calc(100vw - 28px - var(--safe-left) - var(--safe-right));
      padding: 8px 10px 10px;
      border-radius: 28px;
      transform: translateX(-50%);
    }

    .control-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 5px;
      flex: 0 0 auto;
      min-width: 42px;
    }

    .control-label {
      font-size: 11px;
      line-height: 1;
      letter-spacing: 0.01em;
      color: var(--muted);
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
    }

    button,
    .file-button {
      appearance: none;
      width: 42px;
      height: 42px;
      min-width: 42px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
      transition: color 140ms ease, background 140ms ease, border-color 140ms ease, transform 140ms ease;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      flex: 0 0 auto;
    }

    button:hover,
    .file-button:hover {
      color: var(--text);
      background: color-mix(in srgb, var(--text) 8%, transparent);
      transform: translateY(-1px);
    }

    button:focus-visible,
    .file-button:focus-within {
      outline: 2px solid color-mix(in srgb, var(--accent) 48%, transparent);
      outline-offset: 2px;
    }

    button.active {
      color: var(--text);
      border-color: color-mix(in srgb, var(--accent) 44%, transparent);
      background: color-mix(in srgb, var(--accent) 18%, transparent);
    }

    .icon {
      width: 19px;
      height: 19px;
      display: block;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      pointer-events: none;
    }

    #themeToggle .icon-sun { display: none; }
    body.dark #themeToggle .icon-moon { display: none; }
    body.dark #themeToggle .icon-sun { display: block; }

    .divider {
      width: 1px;
      min-width: 1px;
      height: 24px;
      align-self: center;
      margin: 0 2px;
      background: var(--line);
      flex: 0 0 auto;
    }

    .file-button input { display: none; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: grid;
      place-items: center;
      padding: 24px;
      background: color-mix(in srgb, var(--bg-0) 54%, transparent);
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      width: min(420px, calc(100vw - 48px));
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--glass);
      box-shadow: 0 22px 80px var(--shadow);
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .progress {
      width: 100%;
      height: 5px;
      margin-top: 16px;
      overflow: hidden;
      border-radius: 999px;
      background: color-mix(in srgb, var(--text) 9%, transparent);
    }

    .progress span {
      display: block;
      width: 8%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 180ms ease;
    }

    #dropZone {
      position: fixed;
      inset: 0;
      z-index: 7;
      display: grid;
      place-items: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      background: color-mix(in srgb, var(--bg-0) 58%, transparent);
      transition: opacity 160ms ease, visibility 160ms ease;
    }

    #dropZone.visible {
      opacity: 1;
      visibility: visible;
    }

    .drop-card {
      width: min(460px, calc(100vw - 48px));
      padding: 28px;
      border: 1px dashed var(--drop-border);
      border-radius: 30px;
      background: var(--drop-bg);
      text-align: center;
      box-shadow: 0 22px 80px var(--shadow);
    }

    .drop-card strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 16px;
    }

    .drop-card span {
      color: var(--muted);
      font-size: 13px;
    }

    .error { color: #b3261e; }

    @media (max-width: 760px), (pointer: coarse) {
      .topbar {
        top: calc(10px + var(--safe-top));
        left: calc(10px + var(--safe-left));
        right: calc(10px + var(--safe-right));
        align-items: flex-start;
      }


      .controls {
        left: calc(8px + var(--safe-left));
        right: calc(8px + var(--safe-right));
        bottom: calc(8px + var(--safe-bottom));
        width: auto;
        max-width: none;
        height: 54px;
        transform: none;
        justify-content: flex-start;
        align-items: center;
        gap: 4px;
        padding: 6px;
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .controls::-webkit-scrollbar { display: none; }

      .control-item {
        gap: 0;
        min-width: 40px;
      }

      .control-label {
        display: none;
      }

      button,
      .file-button {
        width: 40px;
        height: 40px;
        min-width: 40px;
      }

      .icon {
        width: 18px;
        height: 18px;
      }

      .divider {
        height: 22px;
        margin: 0 1px;
      }

      .drop-card,
      .loader-card {
        width: min(420px, calc(100vw - 28px));
        border-radius: 24px;
      }
    }

    @media (max-width: 430px) {
      .controls {
        height: 50px;
        bottom: calc(6px + var(--safe-bottom));
        padding: 5px;
        gap: 3px;
      }

      .control-item {
        min-width: 38px;
      }

      button,
      .file-button {
        width: 38px;
        height: 38px;
        min-width: 38px;
      }

      .icon {
        width: 17px;
        height: 17px;
      }
    }
  </style>
</head>
<body>

  <div class="topbar" aria-live="polite">
    <div class="status" id="statusText">Loading model</div>
  </div>

  <!-- Icons are inline SVGs using Lucide-style open-source line icon shapes. -->
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="i-hero" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></symbol>

  </svg>

  <div class="controls" aria-label="Preview controls">
    <div class="control-item"><button type="button" data-view="hero" class="active" aria-label="Hero view" title="Hero view"><svg class="icon"><use href="#i-hero"></use></svg><span class="sr-only">Hero view</span></button><span class="control-label">Hero</span></div>
    <div class="control-item"><button type="button" data-view="front" aria-label="Front view" title="Front view"><svg class="icon"><use href="#i-front"></use></svg><span class="sr-only">Front view</span></button><span class="control-label">Front</span></div>
    <div class="control-item"><button type="button" data-view="side" aria-label="Side view" title="Side view"><svg class="icon"><use href="#i-side"></use></svg><span class="sr-only">Side view</span></button><span class="control-label">Side</span></div>
    <span class="divider" aria-hidden="true"></span>
    <div class="control-item"><button type="button" id="prevMockupBtn" aria-label="Previous mockup" title="Previous mockup"><svg class="icon"><use href="#i-prev"></use></svg><span class="sr-only">Previous mockup</span></button><span class="control-label">Prev</span></div>
    <div class="control-item"><button type="button" id="nextMockupBtn" aria-label="Next mockup" title="Next mockup"><svg class="icon"><use href="#i-next"></use></svg><span class="sr-only">Next mockup</span></button><span class="control-label">Next</span></div>
    <div class="control-item"><button type="button" id="rotateBtn" aria-label="Toggle auto rotate" title="Toggle spin"><svg class="icon"><use href="#i-spin"></use></svg><span class="sr-only">Toggle spin</span></button><span class="control-label">Spin</span></div>
    <div class="control-item"><button type="button" id="gridToggleBtn" class="active" aria-label="Toggle grid" title="Toggle grid"><svg class="icon"><use href="#i-grid"></use></svg><span class="sr-only">Toggle grid</span></button><span class="control-label">Grid</span></div>
    <div class="control-item"><button type="button" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme"><svg class="icon icon-moon"><use href="#i-moon"></use></svg><svg class="icon icon-sun"><use href="#i-sun"></use></svg><span class="sr-only">Toggle theme</span></button><span class="control-label">Dark</span></div>
    <div class="control-item"><button type="button" id="shotBtn" aria-label="Save screenshot" title="Save screenshot"><svg class="icon"><use href="#i-camera"></use></svg><span class="sr-only">Save screenshot</span></button><span class="control-label">Save</span></div>
  </div>
  </div>

  <div id="loader">
    <div class="loader-card">
      <strong id="loaderText">Loading Case_Wrap_01.glb</strong>
      <div class="progress"><span id="progressBar"></span></div>
    </div>
  </div>

  <div id="dropZone">
    <div class="drop-card">
      <strong>Mockup cycle</strong>
      <span>Use Prev / Next to cycle through the PNG mockups in the 3d folder.</span>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const MODEL_PATH = './3d/Case_Wrap_01.glb';

    const MOCKUPS = [
      { label: 'A 01', path: './3d/The_Set_Case_Wrap_A_01.png' },
      { label: 'A 02', path: './3d/The_Set_Case_Wrap_A_02.png' },
      { label: 'A 03', path: './3d/The_Set_Case_Wrap_A_03.png' },
      { label: 'B 01', path: './3d/The_Set_Case_Wrap_B_01.png' },
      { label: 'B 02', path: './3d/The_Set_Case_Wrap_B_02.png' },
      { label: 'B 03', path: './3d/The_Set_Case_Wrap_B_03.png' }
    ];

    const stage = document.getElementById('stage');
    const loaderEl = document.getElementById('loader');
    const loaderText = document.getElementById('loaderText');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    const dropZone = document.getElementById('dropZone');
    const themeToggle = document.getElementById('themeToggle');
    const prevMockupBtn = document.getElementById('prevMockupBtn');
    const nextMockupBtn = document.getElementById('nextMockupBtn');
    const rotateBtn = document.getElementById('rotateBtn');
    const gridToggleBtn = document.getElementById('gridToggleBtn');
    const shotBtn = document.getElementById('shotBtn');

    let model = null;
    let modelSize = new THREE.Vector3(1, 1, 1);
    let modelRadius = 1;
    let orbitTarget = new THREE.Vector3(0, 0, 0);
    let autoRotateEnabled = false;
    let currentTheme = 'light';
    let textureTargets = [];
    let currentMockupIndex = 0;
    let currentMockupImage = null;
    let idleStartTimer = null;
    let autoCycleTimer = null;
    let autoCycleActive = false;
    let crossfadeToken = 0;
    let activePixelRatio = 0;
    let renderLoopRunning = false;
    let interactionActive = false;
    let tweenActive = false;
    let restoreQualityTimer = null;

    const isCoarsePointer = window.matchMedia?.('(pointer: coarse)').matches ?? false;
    const isSmallScreen = Math.min(window.innerWidth, window.innerHeight) < 760;
    const isMobileLike = isCoarsePointer || isSmallScreen;

    // The supplied GLB uses one baseColor texture atlas. The printed exterior artwork
    // occupies the left/middle atlas islands. The black interior + edge islands live
    // on the right side of the atlas. This viewer does not alter geometry, groups,
    // normals, or material slots. It makes a new texture image by drawing the uploaded
    // mockup into the exterior UV polygons only, then assigns that new texture to the
    // original material map.
    const EXTERIOR_U_MAX = 0.695;
    const IDLE_DELAY_MS = 5000;
    const MOCKUP_HOLD_MS = 10000;
    const MOCKUP_FADE_MS = 650;

    const scene = new THREE.Scene();
    scene.background = null;

    // v8 quality mode: render at true device pixel ratio instead of downsampling.
    // This costs more GPU, but preserves texture crispness on high-density displays.
    const FULL_QUALITY_PIXEL_RATIO = Math.max(1, window.devicePixelRatio || 1);
    const MAX_IDLE_PIXEL_RATIO = FULL_QUALITY_PIXEL_RATIO;
    const MAX_INTERACTION_PIXEL_RATIO = FULL_QUALITY_PIXEL_RATIO;
    const MAX_SCREENSHOT_PIXEL_RATIO = FULL_QUALITY_PIXEL_RATIO;

    const renderer = new THREE.WebGLRenderer({
      antialias: !isMobileLike,
      alpha: true,
      preserveDrawingBuffer: true,
      powerPreference: 'high-performance'
    });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.94;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    stage.appendChild(renderer.domElement);

    const viewport = getViewportSize();
    const camera = new THREE.PerspectiveCamera(34, viewport.width / viewport.height, 0.01, 1000);
    camera.position.set(1.4, 0.8, 1.7);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.autoRotateSpeed = 0.8;
    controls.target.copy(orbitTarget);
    controls.screenSpacePanning = false;
    controls.enablePan = false;
    controls.rotateSpeed = isMobileLike ? 0.82 : 1.0;
    controls.zoomSpeed = isMobileLike ? 0.72 : 1.0;
    controls.touches = {
      ONE: THREE.TOUCH.ROTATE,
      TWO: THREE.TOUCH.DOLLY_ROTATE
    };

    const presentationGroup = new THREE.Group();
    scene.add(presentationGroup);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0xefe3d0, 1.08);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.55);
    keyLight.position.set(3.5, 4.5, 4.0);
    scene.add(keyLight.target);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(isMobileLike ? 1024 : 2048, isMobileLike ? 1024 : 2048);
    keyLight.shadow.camera.near = 0.01;
    keyLight.shadow.camera.far = 24;
    keyLight.shadow.radius = isMobileLike ? 4.8 : 6.0;
    if ('blurSamples' in keyLight.shadow) keyLight.shadow.blurSamples = isMobileLike ? 8 : 12;
    // Avoid shadow acne / tessellation-looking artifacts on shallow grazing angles.
    // The model casts a shadow onto the floor, but does not receive its own shadow.
    keyLight.shadow.bias = -0.00002;
    keyLight.shadow.normalBias = 0.018;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xfff1d4, 0.62);
    fillLight.position.set(-4, 2, -3);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xd9e2ff, 0.42);
    rimLight.position.set(-2, 4, 5);
    scene.add(rimLight);

    const shadowPlane = new THREE.Mesh(
      new THREE.CircleGeometry(1, 96),
      new THREE.ShadowMaterial({ opacity: 0.10 })
    );
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.receiveShadow = true;
    scene.add(shadowPlane);

    let gridVisible = true;
    let grid = new THREE.GridHelper(2, isMobileLike ? 10 : 16, 0x6d583d, 0x6d583d);
    grid.material.transparent = true;
    grid.material.opacity = 0.09;
    grid.visible = gridVisible;
    scene.add(grid);

    const gltfLoader = new GLTFLoader();
    setRenderPixelRatio(getIdlePixelRatio());
    syncViewportSize();
    applyTheme('light');
    loadModel(MODEL_PATH, 'Case_Wrap_01.glb');
    requestRender();

    function getViewportSize() {
      const width = Math.max(1, Math.round(window.visualViewport?.width || window.innerWidth || document.documentElement.clientWidth));
      const height = Math.max(1, Math.round(window.visualViewport?.height || window.innerHeight || document.documentElement.clientHeight));
      return { width, height };
    }

    function syncViewportSize() {
      const { width, height } = getViewportSize();
      document.documentElement.style.setProperty('--app-height', `${height}px`);
      renderer.setSize(width, height, false);
    }

    function updateCameraAspect() {
      const { width, height } = getViewportSize();
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    function getIdlePixelRatio() {
      return Math.min(window.devicePixelRatio || 1, MAX_IDLE_PIXEL_RATIO);
    }

    function getInteractionPixelRatio() {
      return Math.min(window.devicePixelRatio || 1, MAX_INTERACTION_PIXEL_RATIO);
    }

    function setRenderPixelRatio(pixelRatio) {
      const nextRatio = Math.max(0.75, pixelRatio || 1);
      if (Math.abs(activePixelRatio - nextRatio) < 0.01) return;
      activePixelRatio = nextRatio;
      renderer.setPixelRatio(activePixelRatio);
      syncViewportSize();
    }

    function setInteractiveQuality(enabled) {
      if (restoreQualityTimer) {
        window.clearTimeout(restoreQualityTimer);
        restoreQualityTimer = null;
      }

      if (enabled) {
        setRenderPixelRatio(getInteractionPixelRatio());
      } else {
        restoreQualityTimer = window.setTimeout(() => {
          if (!interactionActive && !autoRotateEnabled && !tweenActive) {
            setRenderPixelRatio(getIdlePixelRatio());
            requestRender();
          }
        }, 180);
      }
    }

    function requestRender() {
      if (renderLoopRunning) return;
      renderLoopRunning = true;
      requestAnimationFrame(renderLoop);
    }

    function renderLoop() {
      controls.autoRotate = autoRotateEnabled;
      const cameraChanged = controls.update();
      renderer.render(scene, camera);

      if (autoRotateEnabled || interactionActive || tweenActive || cameraChanged) {
        requestAnimationFrame(renderLoop);
      } else {
        renderLoopRunning = false;
      }
    }

    function loadModel(source, label = 'model') {
      showLoader(`Reading ${label}`);
      setStatus(`Loading ${label}`);

      gltfLoader.load(
        source,
        (gltf) => {
          if (model) {
            presentationGroup.remove(model);
            disposeObject(model);
          }

          model = gltf.scene;
          textureTargets = [];

          model.traverse((child) => {
            if (!child.isMesh) return;
            child.castShadow = true;
            // Do not let the folded wrap receive shadows on itself. Self-shadowing on
            // the case faces causes shadow acne that looks like triangular tessellation
            // over the print when the light hits at glancing angles.
            child.receiveShadow = false;

            // Keep the mesh exactly as authored. No geometry mutation.
            const materials = Array.isArray(child.material) ? child.material : [child.material];
            materials.forEach((mat) => {
              if (!mat) return;
              mat.envMapIntensity = 0.42;
              if (typeof mat.roughness === 'number') mat.roughness = Math.max(mat.roughness, 0.72);
              if (typeof mat.metalness === 'number') mat.metalness = Math.min(mat.metalness, 0.0);
              stabilizeMaterialDepth(mat);
              prepareTextureTarget(child, mat, Array.isArray(child.material) ? child.material.indexOf(mat) : 0);
            });
          });

          presentationGroup.rotation.set(0, 0, 0);
          presentationGroup.add(model);
          normalizeModel(model);
          updateStageHelpers();
          setView('hero', false);
          applyMockupByIndex(0, false);
          startIdleCountdown();
          hideLoader();
          requestRender();
        },
        (event) => {
          if (event.lengthComputable) {
            const pct = Math.max(4, Math.round((event.loaded / event.total) * 100));
            progressBar.style.width = `${pct}%`;
            loaderText.textContent = `Loading ${label} ${pct}%`;
          } else {
            progressBar.style.width = '42%';
            loaderText.textContent = `Loading ${label}`;
          }
        },
        (error) => {
          console.error(error);

          if (model && presentationGroup.children.includes(model)) {
            hideLoader();
            setStatus(`${label} loaded`);
            requestRender();
            return;
          }

          progressBar.style.width = '100%';
          loaderText.innerHTML = `<span class="error">Could not load ${label}.</span><br>Expected path: <strong>${MODEL_PATH}</strong><br>Run the project folder from a local server.`;
          setStatus(`Could not load ${label}`);
        }
      );
    }

    function stabilizeMaterialDepth(material) {
      // The source GLB marks the material as alphaMode BLEND. For this folded case wrap
      // that can cause transparent-sort artifacts where one face appears over another.
      // The atlas is effectively opaque in all used UV islands, so alphaTest + depthWrite
      // gives correct depth without changing the authored mesh.
      material.transparent = false;
      material.opacity = 1;
      material.alphaTest = 0.001;
      material.depthTest = true;
      material.depthWrite = true;
      material.side = THREE.DoubleSide;
      material.needsUpdate = true;
    }

    function prepareTextureTarget(mesh, material, materialIndex = 0) {
      if (!material?.map || !mesh.geometry?.attributes?.uv) return;

      const originalMap = material.map;
      upgradeTextureSampling(originalMap);
      const originalImage = originalMap.image;
      const uvPolygons = collectExteriorUvPolygons(mesh.geometry, materialIndex);

      if (!originalImage || uvPolygons.length === 0) {
        console.warn('No exterior UV polygons found for texture target:', mesh.name || mesh.uuid, material.name || material.uuid);
        return;
      }

      textureTargets.push({
        mesh,
        material,
        originalMap,
        originalImage,
        uvPolygons,
        replacementMap: null
      });
    }

    function collectExteriorUvPolygons(geometry, materialIndex = 0) {
      const uv = geometry.attributes.uv;
      const index = geometry.index;
      const polygons = [];

      const groups = geometry.groups?.length
        ? geometry.groups
        : [{ start: 0, count: index ? index.count : uv.count, materialIndex }];

      groups.forEach((group) => {
        const groupMaterialIndex = group.materialIndex ?? 0;
        if (groupMaterialIndex !== materialIndex) return;

        const end = group.start + group.count;
        for (let i = group.start; i < end; i += 3) {
          const a = index ? index.getX(i) : i;
          const b = index ? index.getX(i + 1) : i + 1;
          const c = index ? index.getX(i + 2) : i + 2;

          const tri = [
            { u: uv.getX(a), v: uv.getY(a) },
            { u: uv.getX(b), v: uv.getY(b) },
            { u: uv.getX(c), v: uv.getY(c) }
          ];

          const centerU = (tri[0].u + tri[1].u + tri[2].u) / 3;
          const maxU = Math.max(tri[0].u, tri[1].u, tri[2].u);

          // Exterior artwork islands are left of the black interior/edge atlas islands.
          if (centerU <= EXTERIOR_U_MAX && maxU <= EXTERIOR_U_MAX + 0.012) {
            polygons.push(tri);
          }
        }
      });

      return polygons;
    }

    function getImagePixelSize(image) {
      return {
        width: image?.naturalWidth || image?.videoWidth || image?.width || 2048,
        height: image?.naturalHeight || image?.videoHeight || image?.height || 2048
      };
    }

    function getCompositeTextureSize(originalImage, uploadedImage) {
      const original = getImagePixelSize(originalImage);
      const uploaded = getImagePixelSize(uploadedImage);

      // Preserve the original atlas aspect ratio so the GLB UVs stay correct,
      // but scale the atlas up enough to hold the uploaded mockup at full resolution
      // whenever the GPU supports it. No arbitrary 2K/4K quality cap.
      const maxTextureSize = renderer.capabilities.maxTextureSize || 8192;
      const sourceScale = Math.max(
        1,
        uploaded.width / original.width,
        uploaded.height / original.height
      );
      const gpuScale = Math.min(
        sourceScale,
        maxTextureSize / original.width,
        maxTextureSize / original.height
      );

      return {
        width: Math.max(2, Math.round(original.width * gpuScale)),
        height: Math.max(2, Math.round(original.height * gpuScale)),
        wasClamped: gpuScale < sourceScale
      };
    }

    function upgradeTextureSampling(texture) {
      if (!texture) return;
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      texture.generateMipmaps = true;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.needsUpdate = true;
    }

    function loadImageFromFile(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          URL.revokeObjectURL(url);
          resolve(image);
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error(`Could not read ${file.name}`));
        };
        image.src = url;
      });
    }

    function loadImageFromUrl(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error(`Could not load ${url}`));
        image.src = url;
      });
    }

    function clearAutoCycleTimers() {
      if (idleStartTimer) {
        window.clearTimeout(idleStartTimer);
        idleStartTimer = null;
      }
      if (autoCycleTimer) {
        window.clearTimeout(autoCycleTimer);
        autoCycleTimer = null;
      }
    }

    function scheduleAutoCycleAdvance() {
      if (!autoCycleActive) return;
      if (autoCycleTimer) window.clearTimeout(autoCycleTimer);
      autoCycleTimer = window.setTimeout(() => {
        fadeToMockup(currentMockupIndex + 1, true);
      }, MOCKUP_HOLD_MS);
    }

    function startIdleCountdown() {
      clearAutoCycleTimers();
      autoCycleActive = false;
      idleStartTimer = window.setTimeout(() => {
        autoCycleActive = true;
        scheduleAutoCycleAdvance();
      }, IDLE_DELAY_MS);
    }

    function noteUserInteraction() {
      autoCycleActive = false;
      crossfadeToken += 1;
      clearAutoCycleTimers();
      startIdleCountdown();
    }

    function ensureReplacementMap(target, width, height) {
      if (!target.compositeCanvas || target.compositeCanvas.width !== width || target.compositeCanvas.height !== height || !target.replacementMap) {
        if (target.replacementMap) target.replacementMap.dispose();
        target.compositeCanvas = document.createElement('canvas');
        target.compositeCanvas.width = width;
        target.compositeCanvas.height = height;
        target.compositeCtx = target.compositeCanvas.getContext('2d', { alpha: true });
        target.compositeCtx.imageSmoothingEnabled = true;
        target.compositeCtx.imageSmoothingQuality = 'high';

        const texture = new THREE.CanvasTexture(target.compositeCanvas);
        texture.name = 'Exterior composite texture';
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.flipY = false;
        texture.wrapS = target.originalMap.wrapS;
        texture.wrapT = target.originalMap.wrapT;
        texture.generateMipmaps = true;
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        target.replacementMap = texture;
      }
      return target.replacementMap;
    }

    function drawCompositeTexture(target, imageA, imageB = null, blend = 0) {
      const { width, height, wasClamped } = getCompositeTextureSize(target.originalImage, imageB || imageA || target.originalImage);
      const texture = ensureReplacementMap(target, width, height);
      const ctx = target.compositeCtx;

      ctx.clearRect(0, 0, width, height);
      ctx.drawImage(target.originalImage, 0, 0, width, height);
      ctx.save();
      ctx.beginPath();
      target.uvPolygons.forEach((tri) => {
        ctx.moveTo(tri[0].u * width, tri[0].v * height);
        ctx.lineTo(tri[1].u * width, tri[1].v * height);
        ctx.lineTo(tri[2].u * width, tri[2].v * height);
        ctx.closePath();
      });
      ctx.clip();
      if (imageA) ctx.drawImage(imageA, 0, 0, width, height);
      if (imageB && blend > 0) {
        ctx.globalAlpha = Math.min(1, Math.max(0, blend));
        ctx.drawImage(imageB, 0, 0, width, height);
        ctx.globalAlpha = 1;
      }
      ctx.restore();

      texture.userData.wasClampedToGpuLimit = wasClamped;
      texture.userData.textureSize = { width, height };
      texture.needsUpdate = true;
      target.material.map = texture;
      stabilizeMaterialDepth(target.material);
      target.material.needsUpdate = true;
      return texture;
    }

    async function applyMockupByIndex(index, announce = true) {
      if (!model || textureTargets.length === 0) return;

      const wrappedIndex = (index + MOCKUPS.length) % MOCKUPS.length;
      const mockup = MOCKUPS[wrappedIndex];

      try {
        if (announce) setStatus(`Loading mockup ${mockup.label}`);
        const image = await loadImageFromUrl(mockup.path);
        currentMockupIndex = wrappedIndex;
        applyTextureImage(image, mockup.path, `Mockup ${mockup.label}`);
      } catch (error) {
        console.error(error);
        setStatus(`Could not load ${mockup.path}. Make sure the PNG is inside the 3d folder.`);
      }
    }

    async function fadeToMockup(index, fromAuto = false) {
      if (!model || textureTargets.length === 0) return;

      const wrappedIndex = (index + MOCKUPS.length) % MOCKUPS.length;
      const mockup = MOCKUPS[wrappedIndex];
      const myToken = ++crossfadeToken;

      try {
        const nextImage = await loadImageFromUrl(mockup.path);
        const fromImage = currentMockupImage || nextImage;
        const started = performance.now();

        function step(now) {
          if (myToken !== crossfadeToken) return;
          const t = Math.min(1, (now - started) / MOCKUP_FADE_MS);
          const eased = t * t * (3 - 2 * t);
          textureTargets.forEach((target) => drawCompositeTexture(target, fromImage, nextImage, eased));
          requestRender();
          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            currentMockupIndex = wrappedIndex;
            currentMockupImage = nextImage;
            const size = textureTargets[0]?.replacementMap?.userData?.textureSize;
            const clamped = textureTargets.some((target) => target.replacementMap?.userData?.wasClampedToGpuLimit);
            const qualityNote = size ? ` · ${size.width}×${size.height}px atlas` : '';
            if (!fromAuto) setStatus(`Mockup ${mockup.label} applied${qualityNote}${clamped ? ' · GPU limit' : ''}`);
            requestRender();
            if (autoCycleActive) scheduleAutoCycleAdvance();
          }
        }

        requestAnimationFrame(step);
      } catch (error) {
        console.error(error);
        setStatus(`Could not load ${mockup.path}. Make sure the PNG is inside the 3d folder.`);
      }
    }

    function applyTextureImage(image, sourceName, statusLabel = 'Mockup') {
      currentMockupImage = image;
      textureTargets.forEach((target) => {
        drawCompositeTexture(target, image);
      });

      const size = textureTargets[0]?.replacementMap?.userData?.textureSize;
      const clamped = textureTargets.some((target) => target.replacementMap?.userData?.wasClampedToGpuLimit);
      const qualityNote = size ? ` · ${size.width}×${size.height}px atlas` : '';
      setStatus(`${statusLabel} applied${qualityNote}${clamped ? ' · GPU limit' : ''}`);
      requestRender();
    }

    function makeExteriorOnlyTexture(target, uploadedImage) {
      const { width, height, wasClamped } = getCompositeTextureSize(target.originalImage, uploadedImage);
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d', { alpha: true });
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // Start from the original GLB texture so the black inside and edge regions remain exact.
      ctx.clearRect(0, 0, width, height);
      ctx.drawImage(target.originalImage, 0, 0, width, height);

      // Then draw the uploaded mockup only through the exterior UV polygon mask.
      ctx.save();
      ctx.beginPath();
      target.uvPolygons.forEach((tri) => {
        ctx.moveTo(tri[0].u * width, tri[0].v * height);
        ctx.lineTo(tri[1].u * width, tri[1].v * height);
        ctx.lineTo(tri[2].u * width, tri[2].v * height);
        ctx.closePath();
      });
      ctx.clip();
      ctx.drawImage(uploadedImage, 0, 0, width, height);
      ctx.restore();

      const texture = new THREE.CanvasTexture(canvas);
      texture.name = `Exterior composite from ${uploadedImage.src?.split('/').pop() || 'uploaded texture'}`;
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.flipY = false;
      texture.wrapS = target.originalMap.wrapS;
      texture.wrapT = target.originalMap.wrapT;
      texture.generateMipmaps = true;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      texture.userData.wasClampedToGpuLimit = wasClamped;
      texture.userData.textureSize = { width, height };
      texture.needsUpdate = true;
      return texture;
    }

    async function applyTextureFile(file) {
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        setStatus('Drop a texture image: PNG, JPG, WebP, or AVIF');
        return;
      }
      if (!model || textureTargets.length === 0) {
        setStatus('Model is not ready yet or no texture-mapped material was found');
        return;
      }

      try {
        setStatus(`Applying exterior texture: ${file.name}`);
        const uploadedImage = await loadImageFromFile(file);
        applyTextureImage(uploadedImage, file.name, file.name);
      } catch (error) {
        console.error(error);
        setStatus(`Could not apply texture: ${file.name}`);
      }
    }

    function normalizeModel(object) {
      object.updateWorldMatrix(true, true);
      const box = new THREE.Box3().setFromObject(object);
      const center = box.getCenter(new THREE.Vector3());
      object.position.sub(center);

      // Then lift the object so the authored base sits directly on the floor plane.
      object.updateWorldMatrix(true, true);
      const centeredBox = new THREE.Box3().setFromObject(object);
      object.position.y -= centeredBox.min.y;

      object.updateWorldMatrix(true, true);
      const groundedBox = new THREE.Box3().setFromObject(object);
      modelSize = groundedBox.getSize(new THREE.Vector3());
      modelRadius = Math.max(0.1, modelSize.length() * 0.5);
      orbitTarget = groundedBox.getCenter(new THREE.Vector3());
      controls.target.copy(orbitTarget);

      controls.minDistance = Math.max(0.05, modelRadius * 0.42);
      controls.maxDistance = Math.max(8, modelRadius * 12);
      camera.near = Math.max(0.001, modelRadius / 200);
      camera.far = Math.max(100, modelRadius * 100);
      camera.updateProjectionMatrix();
    }

    function updateShadowFraming(box, bottom) {
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const padX = Math.max(0.35, size.x * 0.9);
      const padZ = Math.max(0.35, size.z * 1.2);
      const verticalSpan = Math.max(2.0, size.y * 4.0);

      keyLight.target.position.set(center.x, bottom + size.y * 0.25, center.z);
      keyLight.target.updateMatrixWorld();

      keyLight.shadow.camera.left = -padX;
      keyLight.shadow.camera.right = padX;
      keyLight.shadow.camera.top = padZ;
      keyLight.shadow.camera.bottom = -padZ;
      keyLight.shadow.camera.near = 0.05;
      keyLight.shadow.camera.far = verticalSpan + 8.0;
      keyLight.shadow.camera.updateProjectionMatrix();
      keyLight.shadow.needsUpdate = true;
    }

    function updateStageHelpers() {
      const helperSize = Math.max(modelSize.x, modelSize.z, modelSize.y) * 1.8;
      const box = new THREE.Box3().setFromObject(presentationGroup);
      const bottom = box.min.y;
      updateShadowFraming(box, bottom);

      scene.remove(grid);
      grid.geometry?.dispose?.();
      grid.material?.dispose?.();
      const gridColor = currentTheme === 'dark' ? 0xffffff : 0x6d583d;
      grid = new THREE.GridHelper(helperSize, isMobileLike ? 10 : 14, gridColor, gridColor);
      grid.position.y = bottom + 0.0005;
      grid.material.transparent = true;
      grid.material.opacity = currentTheme === 'dark' ? 0.09 : 0.075;
      grid.visible = gridVisible;
      scene.add(grid);

      shadowPlane.geometry.dispose();
      shadowPlane.geometry = new THREE.CircleGeometry(helperSize * 0.52, 96);
      shadowPlane.position.set(0, bottom + 0.0008, 0);
    }

    function getFitDistance(multiplier = 1.55) {
      const maxDim = Math.max(modelSize.x, modelSize.y, modelSize.z, 0.1);
      const verticalFov = THREE.MathUtils.degToRad(camera.fov);
      const horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * Math.max(camera.aspect, 0.1));
      const verticalDistance = maxDim / (2 * Math.tan(verticalFov / 2));
      const horizontalDistance = maxDim / (2 * Math.tan(horizontalFov / 2));
      return Math.max(verticalDistance, horizontalDistance, modelRadius * 1.85) * multiplier;
    }

    function setView(view, smooth = true) {
      const fit = getFitDistance(isMobileLike ? 1.78 : 1.68);
      const heroDirection = new THREE.Vector3(1.12, 0.42, 1.32).normalize();
      const positions = {
        hero: orbitTarget.clone().add(heroDirection.multiplyScalar(fit * 1.12)),
        front: orbitTarget.clone().add(new THREE.Vector3(0, 0, fit * 1.08)),
        side: orbitTarget.clone().add(new THREE.Vector3(fit * 1.08, 0, 0.001)),
      };

      const targetPosition = positions[view] || positions.hero;
      controls.target.copy(orbitTarget);

      if (!smooth) {
        camera.position.copy(targetPosition);
        camera.lookAt(orbitTarget);
        controls.update();
        updateActiveView(view);
        requestRender();
        return;
      }

      tweenCamera(camera.position.clone(), targetPosition, 420, () => {
        controls.target.copy(orbitTarget);
        camera.lookAt(controls.target);
        controls.update();
      });
      updateActiveView(view);
    }

    function tweenCamera(from, to, duration, onUpdate) {
      const start = performance.now();
      const ease = (t) => 1 - Math.pow(1 - t, 3);
      tweenActive = true;
      setInteractiveQuality(true);
      requestRender();

      function tick(now) {
        const t = Math.min(1, (now - start) / duration);
        camera.position.lerpVectors(from, to, ease(t));
        onUpdate();
        requestRender();
        if (t < 1) {
          requestAnimationFrame(tick);
        } else {
          tweenActive = false;
          setInteractiveQuality(false);
          requestRender();
        }
      }
      requestAnimationFrame(tick);
    }

    function updateActiveView(view) {
      document.querySelectorAll('[data-view]').forEach((button) => {
        button.classList.toggle('active', button.dataset.view === view);
      });
    }

    function applyTheme(theme) {
      currentTheme = theme;
      document.body.classList.toggle('dark', theme === 'dark');
      document.documentElement.style.colorScheme = theme;
      themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      themeToggle.setAttribute('title', theme === 'dark' ? 'Light mode' : 'Dark mode');
      renderer.toneMappingExposure = theme === 'dark' ? 0.90 : 0.94;
      hemiLight.intensity = theme === 'dark' ? 0.96 : 1.08;
      keyLight.intensity = theme === 'dark' ? 1.32 : 1.55;
      fillLight.intensity = theme === 'dark' ? 0.44 : 0.62;
      rimLight.intensity = theme === 'dark' ? 0.55 : 0.42;
      shadowPlane.material.opacity = theme === 'dark' ? 0.14 : 0.10;
      if (model) updateStageHelpers();
      requestRender();
    }

    function takeScreenshot() {
      const previousRatio = activePixelRatio || getIdlePixelRatio();
      setRenderPixelRatio(Math.min(window.devicePixelRatio || 1, MAX_SCREENSHOT_PIXEL_RATIO));
      renderer.render(scene, camera);

      const link = document.createElement('a');
      link.download = 'case-wrap-preview.png';
      link.href = renderer.domElement.toDataURL('image/png');
      link.click();

      setRenderPixelRatio(previousRatio);
      requestRender();
      setStatus('Screenshot saved');
    }

    function showLoader(message) {
      loaderEl.classList.remove('hidden');
      progressBar.style.width = '8%';
      loaderText.textContent = message;
    }

    function hideLoader() {
      progressBar.style.width = '100%';
      window.setTimeout(() => loaderEl.classList.add('hidden'), 180);
    }

    function setStatus(message) {
      statusText.textContent = message;
    }

    function disposeObject(object) {
      object.traverse((child) => {
        if (!child.isMesh) return;
        child.geometry?.dispose?.();
        const materials = Array.isArray(child.material) ? child.material : [child.material];
        materials.forEach((mat) => mat?.dispose?.());
      });
    }

    controls.addEventListener('start', () => {
      interactionActive = true;
      noteUserInteraction();
      setInteractiveQuality(true);
      requestRender();
    });

    controls.addEventListener('change', requestRender);

    controls.addEventListener('end', () => {
      interactionActive = false;
      setInteractiveQuality(false);
      requestRender();
    });

    function handleViewportChange() {
      syncViewportSize();
      updateCameraAspect();
      setRenderPixelRatio(interactionActive ? getInteractionPixelRatio() : getIdlePixelRatio());
      requestRender();
    }

    window.addEventListener('resize', handleViewportChange);
    window.addEventListener('orientationchange', () => window.setTimeout(handleViewportChange, 120));
    window.visualViewport?.addEventListener('resize', handleViewportChange);

    document.addEventListener('touchmove', (event) => {
      if (event.target.closest('.controls')) return;
      event.preventDefault();
    }, { passive: false });

    renderer.domElement.addEventListener('pointerdown', noteUserInteraction);
    renderer.domElement.addEventListener('wheel', noteUserInteraction, { passive: true });
    renderer.domElement.addEventListener('touchstart', noteUserInteraction, { passive: true });

    document.querySelectorAll('[data-view]').forEach((button) => {
      button.addEventListener('click', () => {
        noteUserInteraction();
        setView(button.dataset.view);
      });
    });

    rotateBtn.addEventListener('click', () => {
      noteUserInteraction();
      autoRotateEnabled = !autoRotateEnabled;
      rotateBtn.classList.toggle('active', autoRotateEnabled);
      setInteractiveQuality(autoRotateEnabled);
      requestRender();
      setStatus(autoRotateEnabled ? 'Auto-rotate on' : 'Auto-rotate off');
    });

    gridToggleBtn.addEventListener('click', () => {
      noteUserInteraction();
      gridVisible = !gridVisible;
      if (grid) grid.visible = gridVisible;
      gridToggleBtn.classList.toggle('active', gridVisible);
      requestRender();
      setStatus(gridVisible ? 'Grid on' : 'Grid off');
    });

    themeToggle.addEventListener('click', () => {
      noteUserInteraction();
      applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
      setStatus(currentTheme === 'dark' ? 'Dark mode' : 'Light mode');
    });

    prevMockupBtn.addEventListener('click', () => {
      noteUserInteraction();
      fadeToMockup(currentMockupIndex - 1, false);
    });
    nextMockupBtn.addEventListener('click', () => {
      noteUserInteraction();
      fadeToMockup(currentMockupIndex + 1, false);
    });

    shotBtn.addEventListener('click', () => {
      noteUserInteraction();
      takeScreenshot();
    });

    let dragDepth = 0;

    window.addEventListener('dragenter', (event) => {
      event.preventDefault();
      if (isMobileLike) return;
      dragDepth += 1;
    });

    window.addEventListener('dragover', (event) => {
      event.preventDefault();
      event.dataTransfer.dropEffect = 'copy';
    });

    window.addEventListener('dragleave', (event) => {
      event.preventDefault();
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) dropZone.classList.remove('visible');
    });

    window.addEventListener('drop', (event) => {
      event.preventDefault();
      dragDepth = 0;
      dropZone.classList.remove('visible');
      setStatus('Use Prev / Next to cycle through the mockup PNGs');
    });
  </script>
</body>
</html>
